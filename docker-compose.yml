version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fabric_app
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fabric_net

  postgres:
    image: postgres:16-alpine
    container_name: fabric_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fabric_automation
      POSTGRES_USER: fabric_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabric_user -d fabric_automation"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fabric_net

  redis:
    image: redis:7-alpine
    container_name: fabric_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fabric_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: fabric_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    networks:
      - fabric_net

  nginx:
    image: nginx:alpine
    container_name: fabric_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./uploads:/var/www/uploads:ro
    depends_on:
      - app
    networks:
      - fabric_net

volumes:
  postgres_data:
  redis_data:

networks:
  fabric_net:
    driver: bridge
